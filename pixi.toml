[workspace]
authors = ["adiezsanchez <adiez.biotech@gmail.com>"]
channels = ["conda-forge"]
name = "globias2026_benchmarking"
platforms = ["linux-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
notebook = "jupyter notebook 01_annotation_consensus.ipynb"

[dependencies]
python = "3.11.*"
numpy = ">=1.26"
scipy = ">=1.14"
scikit-image = ">=0.20"
pandas = "*"
matplotlib = "*"
seaborn = "*"
plotly = "*"
tifffile = "*"
imagecodecs = "*"
napari = ">=0.10"
pyqt6 = ">=6"
cellpose = "==3.1.1.3"
stardist = "==0.9.2"
pytorch-cpu = "*"
notebook = "*"
ipykernel = "*"
nbconvert = "*"

# conda-forge publishes a CPU TensorFlow build for Linux and Apple Silicon.
# Windows stopped at TensorFlow 1.14, so that platform uses the CPU wheel.
[target.linux-64.dependencies]
tensorflow-cpu = "*"

[target.osx-arm64.dependencies]
tensorflow-cpu = "*"

[target.win-64.pypi-dependencies]
tensorflow-cpu = "==2.21.0"
